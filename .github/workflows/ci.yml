name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shop:${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - run: docker build -t "$IMAGE" .
      - run: docker run -d -p 8000:8000 "$IMAGE"
      - run: curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8000/health
      - if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - if: github.event_name == 'push'
        run: docker push "$IMAGE"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
  
  build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"
        - run: python build.py
        - uses: actions/upload-pages-artifact@v3
          with:
            path: site
            
  deploy:
      needs: build
      if: github.event_name == 'push'
      runs-on: ubuntu-latest
      permissions:
        pages: write
        id-token: write
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      steps:
        - id: deployment
          uses: actions/deploy-pages@v4
      
           